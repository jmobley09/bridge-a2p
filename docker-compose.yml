services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bridge_a2p
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge_a2p"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
